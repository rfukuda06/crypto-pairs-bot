<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15.5">
  <!-- window -->
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- title bar -->
  <path d="M1 13 a12 12 0 0 1 12 -12 h874 a12 12 0 0 1 12 12 v27 h-898 z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" fill="#8b949e" text-anchor="middle" font-size="13">pairsbot — a real session (highlights)</text>

  <!-- line 1: $ pairsbot screen -->
  <text x="26" y="80" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> pairsbot screen
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.029;0.046;0.92;0.97"/>
  </text>
  <!-- line 2: Selected LTC/XLM ... -->
  <text x="26" y="108" fill="#8b949e" opacity="0">Selected <tspan fill="#58a6ff">LTC/XLM</tspan>  beta=0.2980  p=0.02166  (frozen)
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.079;0.096;0.92;0.97"/>
  </text>

  <!-- line 3: $ pairsbot optimize -->
  <text x="26" y="162" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> pairsbot optimize
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.200;0.218;0.92;0.97"/>
  </text>
  <!-- line 4: in-sample -->
  <text x="26" y="190" fill="#8b949e" opacity="0">in-sample&#160;&#160;&#160;&#160;&#160;&#160;Sharpe <tspan fill="#3fb950">1.68</tspan>&#160;&#160;&#160;&#160;return <tspan fill="#3fb950">+61.89%</tspan>  <tspan fill="#6e7681">(looks great)</tspan>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.250;0.268;0.92;0.97"/>
  </text>
  <!-- line 5: out-of-sample -->
  <text x="26" y="218" fill="#8b949e" opacity="0">out-of-sample&#160;&#160;tuned <tspan fill="#f85149">-16.37%</tspan>&#160;&#160;&#160;&#160;default <tspan fill="#f85149">-17.76%</tspan>  <tspan fill="#6e7681">(loses)</tspan>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.293;0.311;0.92;0.97"/>
  </text>

  <!-- line 6: $ pairsbot status -->
  <text x="26" y="272" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> pairsbot status
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.414;0.432;0.92;0.97"/>
  </text>
  <!-- line 7: status one-liner -->
  <text x="26" y="300" fill="#8b949e" opacity="0">run #1 (live, <tspan fill="#58a6ff">LTC/XLM</tspan>)&#160;&#160;·&#160;&#160;equity <tspan fill="#e6edf3">$10,000</tspan>&#160;&#160;·&#160;&#160;drawdown 0.00%
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.464;0.482;0.92;0.97"/>
  </text>

  <!-- ready prompt + blinking cursor -->
  <text x="26" y="344" fill="#3fb950" opacity="0">$
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.50;0.52;0.92;0.97"/>
  </text>
  <rect x="40" y="331" width="9" height="17" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;1;0;1;0" keyTimes="0;0.52;0.55;0.62;0.69;0.76;0.83;0.92"/>
  </rect>
</svg>
